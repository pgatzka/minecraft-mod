name: Release

# Pushing a tag v<mod_version> (e.g. v1.0.0, or v1.1.0-beta.1 for a pre-release) builds and tests the mod, creates a
# GitHub release with the jar, and publishes it to Modrinth and/or CurseForge if their tokens are set up (docs/README.md)
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Check that the tag matches mod_version
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match mod_version=$version in gradle.properties"
            exit 1
          fi
          echo "MOD_VERSION=$version" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-build

      - name: Build
        run: ./gradlew build

      - name: Run GameTests
        run: ./gradlew runGameTestServer

      - name: Upload the GameTest server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-logs-${{ github.ref_name }}
          path: run/logs/
          if-no-files-found: ignore

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/minecraftmod-${{ env.MOD_VERSION }}.jar
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

      # Only runs once a token is set up; platforms without a token are skipped
      - name: Publish to Modrinth and CurseForge
        if: env.MODRINTH_TOKEN != '' || env.CURSEFORGE_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/minecraftmod-${{ env.MOD_VERSION }}.jar
          name: Minecraft Mod ${{ env.MOD_VERSION }}
          version: ${{ env.MOD_VERSION }}
          version-type: ${{ contains(github.ref_name, '-') && 'beta' || 'release' }}
          loaders: forge
          game-versions: 1.20.1
          java: 17
