name: Set up build
description: Installs JDK 17 (Minecraft) and JDK 21 (Gradle), and sets up Gradle with caching

runs:
  using: composite
  steps:
    # Gradle 8.8 runs on JDK 21 (gradle/gradle-daemon-jvm.properties); the mod compiles and runs on the Java 17
    # toolchain (docs/decisions/0033). The last version listed becomes JAVA_HOME.
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: |
          17
          21

    - uses: gradle/actions/setup-gradle@v4

    # Gradle doesn't look in the runner's tool cache by itself, so tell it about both JDKs
    - name: Show Gradle the runner's JDKs
      shell: bash
      run: |
        mkdir -p ~/.gradle
        echo "org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64" >> ~/.gradle/gradle.properties
