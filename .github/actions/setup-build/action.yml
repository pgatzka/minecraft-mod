name: Set up build
description: Installs JDK 17 (Minecraft) and JDK 21 (Gradle), and sets up Gradle with caching

runs:
  using: composite
  steps:
    # Gradle 8.8 runs on JDK 21; the mod compiles and runs on the Java 17 toolchain (docs/decisions/0003)
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: |
          17
          21

    - uses: gradle/actions/setup-gradle@v4

    # The project's gradle.properties may point org.gradle.java.home at a local Windows JDK. Settings in the Gradle user
    # home win over the project's, so point Gradle at the runner's JDK 21 and let the toolchain use the installed JDK 17.
    - name: Point Gradle at the runner's JDKs
      shell: bash
      run: |
        mkdir -p ~/.gradle
        {
          echo "org.gradle.java.home=$JAVA_HOME_21_X64"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64"
        } >> ~/.gradle/gradle.properties
